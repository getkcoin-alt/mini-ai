name: Mini Voice Worker Sanity
on:
  push:
    branches: [main]
    paths:
      - "services/voice_worker/**"
      - ".github/workflows/voice-worker-sanity.yml"
  pull_request:
    paths:
      - "services/voice_worker/**"
permissions:
  contents: read
jobs:
  syntax-and-reference-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check Python syntax (does not download model weights)
        run: python -m compileall -q services/voice_worker
      - name: Test private dual-style audio reference importer
        run: |
          python - <<'PY'
          import io, os, tempfile, wave, zipfile
          from pathlib import Path
          from services.voice_worker.install_reference_pack import install
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              archive = root / "voice.zip"
              with zipfile.ZipFile(archive, 'w') as z:
                  for style in ("bright", "calm"):
                      out = io.BytesIO()
                      with wave.open(out, 'wb') as w:
                          w.setnchannels(1)
                          w.setsampwidth(2)
                          w.setframerate(24000)
                          w.writeframes(b'\x00' * (24000 * 2 * 5))
                      z.writestr(f"mini_voice_{style}_24k.wav", out.getvalue())
              result = install(archive, root / "private")
              assert result == {"friend": 5.0, "mentor": 5.0}, result
              assert (root / "private" / "reference_friend.wav").is_file()
              assert (root / "private" / "reference_mentor.wav").is_file()
              assert os.stat(root / "private" / "reference_friend.wav").st_mode & 0o077 == 0
              print("Private dual-style reference installer test: PASS")
          PY
