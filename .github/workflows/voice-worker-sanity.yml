name: Mini Voice Worker Sanity
on:
  push:
    branches: [main]
    paths:
      - "services/voice_worker/**"
      - "scripts/nfc_vm_preflight.sh"
      - "scripts/nfc_create_mini_vm.sh"
      - ".github/workflows/voice-worker-sanity.yml"
  pull_request:
    paths:
      - "services/voice_worker/**"
      - "scripts/nfc_vm_preflight.sh"
      - "scripts/nfc_create_mini_vm.sh"
permissions:
  contents: read
jobs:
  syntax-and-reference-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check Python syntax (does not download model weights)
        run: python -m compileall -q services/voice_worker
      - name: Test shared-VPS memory limits and voice-request serialization
        run: python -m unittest discover -s services/voice_worker/tests -p 'test_*.py' -v
      - name: Check CPU and local startup shell scripts
        run: bash -n services/voice_worker/setup_cpu_ubuntu.sh services/voice_worker/start-local.sh services/voice_worker/linux_preflight.sh
      - name: Check read-only NFC KVM preparation script syntax
        run: bash -n scripts/nfc_vm_preflight.sh
      - name: Check guarded NFC VM creator syntax
        run: bash -n scripts/nfc_create_mini_vm.sh
      - name: Check benchmark imports in both direct and module modes
        run: |
          python - <<'PY'
          import runpy, sys, types
          # This smoke test intentionally avoids installing large AI packages.
          sys.modules["httpx"] = types.ModuleType("httpx")
          runpy.run_path("services/voice_worker/benchmark_cpu.py", run_name="import_probe")
          runpy.run_module("services.voice_worker.benchmark_cpu", run_name="import_probe")
          print("Benchmark import-path smoke test: PASS")
          PY
      - name: Check staged speech pipeline CLI without loading models
        run: |
          python -m services.voice_worker.benchmark_pipeline --help >/dev/null
          python -m compileall -q services/voice_worker/benchmark_pipeline.py
      - name: Validate resident CPU voice benchmark without downloading models
        run: |
          python -m services.voice_worker.benchmark_resident --help >/dev/null
          python -m compileall -q services/voice_worker/benchmark_resident.py
      - name: Test private dual-style audio reference importer
        run: |
          python - <<'PY'
          import io, os, tempfile, wave, zipfile
          from pathlib import Path
          from services.voice_worker.install_reference_pack import install
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              archive = root / "voice.zip"
              with zipfile.ZipFile(archive, 'w') as z:
                  for style in ("bright", "calm"):
                      out = io.BytesIO()
                      with wave.open(out, 'wb') as w:
                          w.setnchannels(1)
                          w.setsampwidth(2)
                          w.setframerate(24000)
                          w.writeframes(b'\x00' * (24000 * 2 * 5))
                      z.writestr(f"mini_voice_{style}_24k.wav", out.getvalue())
              result = install(archive, root / "private")
              assert result == {"friend": 5.0, "mentor": 5.0}, result
              assert (root / "private" / "reference_friend.wav").is_file()
              assert (root / "private" / "reference_mentor.wav").is_file()
              assert os.stat(root / "private" / "reference_friend.wav").st_mode & 0o077 == 0
              print("Private dual-style reference installer test: PASS")
          PY
