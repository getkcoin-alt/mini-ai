name: uptime

# Pings Mini every 15 minutes. A failed run makes GitHub email whoever last
# changed this schedule (the repo owner by default).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Voice worker health (api.themistones.com)
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://api.themistones.com/health
      - name: Website (mini-ai-six.vercel.app)
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://mini-ai-six.vercel.app/
      - name: Live voice config endpoint answers (expects 401 without sign-in)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://mini-ai-six.vercel.app/api/voice/realtime-config)" = "401"
