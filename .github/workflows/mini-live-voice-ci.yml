name: Mini Live Phrase Lab Checks

on:
  push:
    branches:
      - experiment/mini-reflex-streaming
  pull_request:
    paths:
      - "services/voice_worker/**"
      - "mini-live-browser.js"
      - "app.js"
      - "tests/mini-live-client.test.mjs"
      - ".github/workflows/mini-live-voice-ci.yml"

permissions:
  contents: read

jobs:
  live-lab-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Python syntax and pure local WebSocket guards
        run: |
          python -m compileall -q services/voice_worker/live_socket.py services/voice_worker/streaming_lab.py
          python -m unittest services.voice_worker.tests.test_live_socket services.voice_worker.tests.test_streaming_lab -v
      - name: Browser streaming client security tests
        run: |
          node --check mini-live-browser.js
          node --check app.js
          node --test tests/mini-live-client.test.mjs
      - name: Confirm explicit default-off safety
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('services/voice_worker/live_socket.py').read_text()
          assert 'MINI_ENABLE_LIVE_WS", "0"' in src
          assert 'local_websocket_allowed(ws)' in src
          assert 'MAX_AUDIO_BYTES = 3_000_000' in src
          print('Live stream preview fail-closed design: verified')
          PY
