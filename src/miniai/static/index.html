<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11111a" />
    <title>Mini AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="orb" aria-hidden="true"><span></span></div>
        <div>
          <p class="eyebrow">YOUR PRIVATE COMPANION</p>
          <h1>Mini AI</h1>
          <p id="presence">Waiting for your Mini link…</p>
        </div>
      </header>

      <section id="welcome" class="card welcome">
        <h2>One small key, one private space.</h2>
        <p>Enter the PIN shared with you. It stays in this browser tab and is never placed in the URL.</p>
        <form id="pin-form">
          <label for="pin">Mini PIN</label>
          <div class="row">
            <input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" minlength="4" maxlength="12" required />
            <button type="submit">Unlock</button>
          </div>
          <p id="pin-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="chat" class="card chat" hidden>
        <div class="toolbar">
          <label>Mode
            <select id="mode">
              <option value="friend">Best Friend</option>
              <option value="mentor">Mentor</option>
            </select>
          </label>
          <label id="remember-wrap" class="toggle" hidden>
            <input id="remember" type="checkbox" />
            Remember in Vault Zeta
          </label>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">Message Mini</label>
          <textarea id="message" rows="2" maxlength="8000" placeholder="Talk to Mini…" required></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
